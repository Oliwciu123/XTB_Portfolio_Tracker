[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtb-analyzer"
version = "0.1.0"
description = "Analyze XTB portfolio from CSV cash operation exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
    "matplotlib>=3.7",
    "plotly>=5.18",
    "requests>=2.31",
    "openpyxl>=3.1",
    "ipykernel>=6.25",
    "ipywidgets>=8.0",
    "notebook>=7.0",
    "pywebview>=5.1",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xtb_analyzer = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
